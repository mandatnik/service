openapi: 3.0.3
info:
  title: Telehack 2026 agent API
  version: "1"
  description: |
    Версионированный REST/HTTPS контракт агента. Все тела запросов —
    конверт {data, sign, host}; data канонизируется JCS (RFC 8785) и
    подписывается ECDSA P-256/SHA-256/ASN.1 DER/Base64. Подробности:
    docs/protocol.md.
servers:
  - url: https://backend.example:8443
paths:
  /api/agent/v1/register:
    post:
      summary: Первичная регистрация или повтор с прежним ключом
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterEnvelope' }
      responses:
        '200':
          description: Зарегистрировано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/agent/v1/rename:
    post:
      summary: Подписанный переход при переименовании
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameEnvelope' }
      responses:
        '200':
          description: Переход выполнен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/agent/v1/sync:
    post:
      summary: Конфигурация по хешу и задания
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncEnvelope' }
      responses:
        '200':
          description: Конфигурация и задания
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/agent/v1/report:
    post:
      summary: Идемпотентная доставка отчёта
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportEnvelope' }
      responses:
        '200':
          description: Отчёт принят или уже был принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/agent/v1/jobs/ack:
    post:
      summary: Подтверждение состояния задания
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobAckEnvelope' }
      responses:
        '200':
          description: Подтверждение принято
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAckResponse' }
  /api/agent/v1/capabilities:
    post:
      summary: Регистрация возможностей и RSA-3072 ключа шифрования параметров
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilitiesEnvelope' }
      responses:
        '200':
          description: Возможности и полная конфигурация
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilitiesResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/agent/v1/tasks/sync:
    post:
      summary: Получение элементов задач с зашифрованными параметрами
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskSyncEnvelope' }
      responses:
        '200':
          description: Публичные элементы задач без plaintext-параметров
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSyncResponse' }
  /api/agent/v1/tasks/ack:
    post:
      summary: Durable delivery ACK
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskAckEnvelope' }
      responses:
        '200':
          description: ACK принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskAckResponse' }
  /api/agent/v1/tasks/claim:
    post:
      summary: Разрешение на начало изменяющей операции
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskClaimEnvelope' }
      responses:
        '200':
          description: Claim выдан или отклонён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskClaimResponse' }
  /api/agent/v1/tasks/progress:
    post:
      summary: Allowlist-событие выполнения
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskProgressEnvelope' }
      responses:
        '200':
          description: Событие сохранено
  /api/agent/v1/tasks/result:
    post:
      summary: Санитизированный результат выполнения
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskResultEnvelope' }
      responses:
        '200':
          description: Результат принят или идемпотентно повторён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResultResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/agent/v1/tasks/diagnostic:
    post:
      summary: Диагностика локального журнала без секретов
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskDiagnosticEnvelope' }
      responses:
        '200':
          description: Диагностика принята
  /api/admin/v1/license-pools:
    get:
      summary: Список пулов и счётчиков
      responses:
        '200': { description: Пулы }
    post:
      summary: Создать пул
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LicensePoolInput' }
      responses:
        '201': { description: Пул создан }
  /api/admin/v1/license-pools/{id}:
    patch:
      summary: Переименовать пул (версия/тип/срок неизменяемы)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Пул обновлён }
  /api/admin/v1/license-pools/{id}/archive:
    post:
      summary: Архивировать или вернуть пул
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Состояние архива обновлено }
  /api/admin/v1/license-pools/{id}/licenses/import:
    post:
      summary: Атомарный импорт номеров; plaintext не возвращается и не аудируется
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Импорт принят }
        '422': { description: Импорт отклонён целиком }
  /api/admin/v1/license-pools/{id}/licenses:
    get:
      summary: Ключи пула только с маской и безопасными кодами
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Страница ключей }
  /api/admin/v1/license-pools/{id}/history:
    get:
      summary: История закреплений и событий ключей без номеров
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: История }
  /api/admin/v1/licenses/{id}/block:
    post:
      summary: Заблокировать свободный ключ с причиной
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Ключ заблокирован }
  /api/admin/v1/tasks/activation-preview:
    post:
      summary: Четыре списка совместимости и основания классификации
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivationPreviewInput' }
      responses:
        '200': { description: Preview со сроком 10 минут }
  /api/admin/v1/tasks:
    get:
      summary: Список задач с агрегатами
      responses:
        '200': { description: Задачи }
    post:
      summary: Создать scan или install_license идемпотентно
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskInput' }
      responses:
        '202': { description: Задача создана }
        '409': { description: preview_stale, license_deficit или idempotency_conflict }
  /api/admin/v1/tasks/{id}:
    get:
      summary: Детали задачи и выполнений
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Детали }
  /api/admin/v1/tasks/{id}/items:
    get:
      summary: Выполнения задачи
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Выполнения }
  /api/admin/v1/tasks/{id}/cancel:
    post:
      summary: Запросить отмену задачи
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Отмена запрошена }
  /api/admin/v1/task-items/{id}/events:
    get:
      summary: Журнал выполнений без секретов
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: События }
  /api/admin/v1/task-items/{id}/cancel:
    post:
      summary: Запросить отмену выполнения
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Отмена запрошена }
  /api/admin/v1/task-items/{id}/reconcile:
    post:
      summary: Read-only согласование неизвестного результата
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Сверка запрошена }
components:
  responses:
    Conflict:
      description: Конфликт идентичности/повтора/отчёта
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Идентичность не авторизована
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Invalid:
      description: Семантическая ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Host:
      type: object
      required: [uuid, hostname]
      properties:
        uuid: { type: string, format: uuid }
        hostname: { type: string, maxLength: 253 }
    BaseData:
      type: object
      required: [protocol_version, operation, request_id, uuid, hostname, method, path, issued_at, agent_version]
      properties:
        protocol_version: { type: string, enum: ["1"] }
        operation: { type: string, enum: [register, rename, sync, report, job_ack, capabilities, task_sync, task_ack, task_claim, task_progress, task_result, task_diagnostic] }
        request_id: { type: string, format: uuid }
        uuid: { type: string, format: uuid }
        hostname: { type: string, maxLength: 253 }
        method: { type: string, enum: [POST] }
        path: { type: string }
        issued_at: { type: string, format: date-time }
        agent_version: { type: string }
        os_version: { type: string }
        architecture: { type: string }
      additionalProperties: true
    RegisterData:
      allOf:
        - $ref: '#/components/schemas/BaseData'
        - type: object
          required: [public_key]
          properties:
            public_key: { type: string }
    RenameData:
      allOf:
        - $ref: '#/components/schemas/BaseData'
        - type: object
          required: [new_uuid, new_hostname, new_public_key]
          properties:
            new_uuid: { type: string, format: uuid }
            new_hostname: { type: string, maxLength: 253 }
            new_public_key: { type: string }
    SyncData:
      allOf:
        - $ref: '#/components/schemas/BaseData'
        - type: object
          properties:
            config_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
    ReportData:
      allOf:
        - $ref: '#/components/schemas/BaseData'
        - type: object
          required: [report_id, scan_seq, collected_at, report]
          properties:
            report_id: { type: string, format: uuid }
            scan_seq: { type: integer, minimum: 0 }
            collected_at: { type: string, format: date-time }
            report: { $ref: '#/components/schemas/Report' }
    JobAckData:
      allOf:
        - $ref: '#/components/schemas/BaseData'
        - type: object
          required: [job_id, job_status]
          properties:
            job_id: { type: string, format: uuid }
            job_status: { type: string, enum: [completed, failed, report_evicted] }
            job_report_id: { type: string, format: uuid }
            job_message: { type: string, maxLength: 1024 }
    BaseEnvelope:
      type: object
      required: [data, sign, host]
      properties:
        data: { type: object }
        sign: { type: string, description: Base64 ASN.1 DER ECDSA signature }
        host: { $ref: '#/components/schemas/Host' }
      additionalProperties: false
    RegisterEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/RegisterData' }
    RenameEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/RenameData' }
    SyncEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/SyncData' }
    ReportEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ReportData' }
    JobAckEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/JobAckData' }
    AgentConfig:
      type: object
      required: [version, scan_interval_days, cert_directories, recursive, max_files, max_file_bytes]
      properties:
        version: { type: integer, minimum: 1 }
        scan_interval_days: { type: integer, minimum: 1, maximum: 365 }
        cert_directories:
          type: array
          deprecated: true
          maxItems: 0
          description: Legacy field, always empty in effective agent configurations. Use folder_policies.
          items: { type: string }
        folder_policies:
          type: array
          maxItems: 128
          items:
            type: object
            required: [id, name, rules, level]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, maxLength: 200 }
              rules: { type: string, description: 'Absolute folder patterns; positive include, ! exclude, last matching rule wins.' }
              level: { type: string, enum: [machine, group] }
        recursive: { type: boolean }
        max_files: { type: integer, minimum: 1, maximum: 10000 }
        max_file_bytes: { type: integer, minimum: 1024, maximum: 10485760 }
        poll_interval_seconds: { type: integer, minimum: 10, maximum: 3600, description: 'Sent only to schedule_v2 agents; participates in their config_hash.' }
        inventory_freshness_seconds: { type: integer, minimum: 60, maximum: 2592000 }
        task_ttl_seconds: { type: integer, minimum: 60, maximum: 2592000 }
    RegisterResponse:
      type: object
      required: [machine_id, uuid, hostname, registered_at, config, config_hash, server_time]
      properties:
        machine_id: { type: string, format: uuid }
        uuid: { type: string, format: uuid }
        hostname: { type: string }
        registered_at: { type: string, format: date-time }
        config: { $ref: '#/components/schemas/AgentConfig' }
        config_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        server_time: { type: string, format: date-time }
        warnings: { type: array, items: { type: string } }
    SyncResponse:
      type: object
      required: [server_time, config_hash, jobs]
      properties:
        server_time: { type: string, format: date-time }
        config: { $ref: '#/components/schemas/AgentConfig' }
        config_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        jobs:
          type: array
          items:
            type: object
            required: [job_id, kind, created_at]
            properties:
              job_id: { type: string, format: uuid }
              kind: { type: string, enum: [scan] }
              created_at: { type: string, format: date-time }
        warnings: { type: array, items: { type: string } }
    ReportResponse:
      type: object
      required: [accepted, duplicate, applied, report_id, received_at]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        applied: { type: boolean }
        report_id: { type: string, format: uuid }
        received_at: { type: string, format: date-time }
        reason: { type: string }
        warnings: { type: array, items: { type: string } }
    JobAckResponse:
      type: object
      required: [accepted, job_id, state]
      properties:
        accepted: { type: boolean }
        job_id: { type: string, format: uuid }
        state: { type: string }
        duplicate: { type: boolean }
    CapabilitiesData:
      allOf:
        - $ref: '#/components/schemas/BaseData'
        - type: object
          required: [capabilities, encryption_key_id, encryption_public_key, encryption_algorithm, encryption_bits]
          properties:
            capabilities: { type: array, maxItems: 32, items: { type: string, maxLength: 64 } }
            encryption_key_id: { type: string, pattern: '^[0-9a-f]{64}$' }
            encryption_public_key: { type: string }
            encryption_algorithm: { type: string, enum: [RSA-OAEP-SHA256+AES-256-GCM] }
            encryption_bits: { type: integer, enum: [3072] }
            encryption_key_rotate: { type: boolean }
    CapabilitiesEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CapabilitiesData' }
    CapabilitiesResponse:
      type: object
      required: [accepted, server_time, encryption_key_id, config_hash, poll_interval_seconds, task_ttl_seconds]
      properties:
        accepted: { type: boolean }
        server_time: { type: string, format: date-time }
        encryption_key_id: { type: string }
        config: { $ref: '#/components/schemas/AgentConfig' }
        config_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        poll_interval_seconds: { type: integer }
        task_ttl_seconds: { type: integer }
        warnings: { type: array, items: { type: string } }
    EncryptedParameters:
      type: object
      required: [version, algorithm, recipient_key_id, wrapped_key, nonce, ciphertext]
      properties:
        version: { type: integer, enum: [1] }
        algorithm: { type: string, enum: [RSA-OAEP-SHA256+AES-256-GCM] }
        recipient_key_id: { type: string, pattern: '^[0-9a-f]{64}$' }
        wrapped_key: { type: string, description: Base64 RSA-OAEP-SHA256 content key }
        nonce: { type: string, description: Base64 12-byte AES-GCM nonce }
        ciphertext: { type: string, description: Base64 AES-256-GCM ciphertext }
    TaskItemDelivery:
      type: object
      required: [task_id, item_id, machine_id, registration_id, kind, state, delivery_version, encryption_key_id, parameters_envelope, expires_at]
      properties:
        task_id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        machine_id: { type: string, format: uuid }
        registration_id: { type: integer, format: int64 }
        kind: { type: string, enum: [scan, install_license] }
        state: { type: string, enum: [queued, delivered, running, retry_wait, outcome_unknown] }
        delivery_version: { type: integer, minimum: 1 }
        encryption_key_id: { type: string }
        parameters_version: { type: integer, enum: [1] }
        parameters_envelope: { $ref: '#/components/schemas/EncryptedParameters' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        cancel_requested: { type: boolean }
        reconcile_requested: { type: boolean }
        attempt_count: { type: integer, minimum: 0, maximum: 3 }
        license_id: { type: string, format: uuid }
    TaskSyncResponse:
      type: object
      required: [server_time, items]
      properties:
        server_time: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/TaskItemDelivery' } }
        warnings: { type: array, items: { type: string } }
    TaskAckData:
      allOf:
        - $ref: '#/components/schemas/BaseData'
        - type: object
          required: [task_item_id, task_delivery_version]
          properties:
            task_item_id: { type: string, format: uuid }
            task_delivery_version: { type: integer, minimum: 1 }
    TaskAckEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TaskAckData' }
    TaskAckResponse:
      type: object
      required: [accepted, item_id, state, server_time]
      properties:
        accepted: { type: boolean }
        item_id: { type: string, format: uuid }
        state: { type: string }
        duplicate: { type: boolean }
        server_time: { type: string, format: date-time }
    TaskClaimData:
      allOf:
        - $ref: '#/components/schemas/TaskAckData'
    TaskClaimEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TaskClaimData' }
    TaskClaimResponse:
      type: object
      required: [granted, item_id, state, server_time]
      properties:
        granted: { type: boolean }
        item_id: { type: string, format: uuid }
        state: { type: string }
        claim_until: { type: string, format: date-time }
        reason_code: { type: string }
        server_time: { type: string, format: date-time }
    TaskProgressEvent:
      type: object
      required: [item_id, event_type, occurred_at]
      properties:
        item_id: { type: string, format: uuid }
        attempt_no: { type: integer, minimum: 0, maximum: 3 }
        event_type: { type: string }
        stage: { type: string }
        event_code: { type: string }
        windows_error: { type: string }
        duration_ms: { type: integer }
        occurred_at: { type: string, format: date-time }
        delivery_version: { type: integer }
    TaskProgressData:
      allOf:
        - $ref: '#/components/schemas/BaseData'
        - type: object
          required: [task_item_id, task_event]
          properties:
            task_item_id: { type: string, format: uuid }
            task_event: { $ref: '#/components/schemas/TaskProgressEvent' }
    TaskProgressEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TaskProgressData' }
    TaskResult:
      type: object
      required: [item_id, delivery_version, state, modified, result_version]
      properties:
        item_id: { type: string, format: uuid }
        delivery_version: { type: integer, minimum: 1 }
        state: { type: string, enum: [succeeded, skipped, failed, retry_wait, outcome_unknown, cancelled, expired] }
        reason_code: { type: string }
        message: { type: string }
        attempt_no: { type: integer, minimum: 0, maximum: 3 }
        result_version: { type: integer, minimum: 1 }
        modified: { type: string, enum: [no, maybe, yes] }
        serial_match: { type: boolean }
        report_id: { type: string, format: uuid }
        license: { $ref: '#/components/schemas/TaskLicenseState' }
        reconcile: { type: boolean }
    TaskLicenseState:
      type: object
      properties:
        present: { type: boolean }
        complete: { type: boolean }
        product_version: { type: string }
        core_version: { type: string }
        environment: { type: string, enum: [workstation, server, unknown] }
        kind: { type: string, enum: [client, server, unknown] }
        kind_raw: { type: string }
        state: { type: string, enum: [active, expired, not_installed, unknown, error] }
        term_kind: { type: string, enum: [trial, time_limited, perpetual, unknown] }
        is_trial: { type: string, enum: ['true', 'false', 'unknown'] }
        valid_to_raw: { type: string }
        valid_to_utc: { type: string }
        time_basis: { type: string }
        source: { type: string }
        error_code: { type: string }
    TaskResultData:
      allOf:
        - $ref: '#/components/schemas/BaseData'
        - type: object
          required: [task_item_id, task_result]
          properties:
            task_item_id: { type: string, format: uuid }
            task_result: { $ref: '#/components/schemas/TaskResult' }
    TaskResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TaskResultData' }
    TaskResultResponse:
      type: object
      required: [accepted, item_id, state, server_time]
      properties:
        accepted: { type: boolean }
        item_id: { type: string, format: uuid }
        state: { type: string }
        duplicate: { type: boolean }
        server_time: { type: string, format: date-time }
    TaskDiagnostic:
      type: object
      required: [code]
      properties:
        item_id: { type: string, format: uuid }
        code: { type: string }
        message: { type: string }
        occurred_at: { type: string, format: date-time }
    TaskDiagnosticData:
      allOf:
        - $ref: '#/components/schemas/BaseData'
        - type: object
          required: [task_diagnostic]
          properties:
            task_diagnostic: { $ref: '#/components/schemas/TaskDiagnostic' }
    TaskDiagnosticEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TaskDiagnosticData' }
    TaskSyncData:
      allOf:
        - $ref: '#/components/schemas/BaseData'
        - type: object
          properties:
            task_queue: { type: object, additionalProperties: true }
    TaskSyncEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TaskSyncData' }
    LicensePoolInput:
      type: object
      required: [name, csp_major_version, license_kind, term]
      properties:
        name: { type: string, maxLength: 200 }
        csp_major_version: { type: integer, enum: [4, 5] }
        license_kind: { type: string, enum: [client, server] }
        term: { type: string, enum: [one_year, two_years, perpetual] }
    ActivationPreviewInput:
      type: object
      required: [pool_id]
      properties:
        pool_id: { type: string, format: uuid }
        machine_ids: { type: array, items: { type: string, format: uuid } }
        group_ids: { type: array, items: { type: string, format: uuid } }
    CreateTaskInput:
      type: object
      required: [kind, idempotency_key]
      properties:
        kind: { type: string, enum: [scan, install_license] }
        pool_id: { type: string, format: uuid }
        preview_id: { type: string, format: uuid }
        machine_ids: { type: array, maxItems: 5000, items: { type: string, format: uuid } }
        group_ids: { type: array, items: { type: string, format: uuid } }
        idempotency_key: { type: string, maxLength: 128 }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    ProfileResult:
      type: object
      required: [sid, name, profile_path, loaded, store_present, complete]
      properties:
        sid: { type: string }
        name: { type: string }
        profile_path: { type: string }
        loaded: { type: boolean }
        store_present: { type: boolean }
        complete: { type: boolean }
        error: { type: string }
    ObservedCertificate:
      type: object
      required: [sha256, der_base64]
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        der_base64: { type: string }
        serial_hex: { type: string }
        serial_number: { type: string }
        subject: { type: string }
        issuer: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        owner_cn: { type: string }
        inn: { type: string }
        snils: { type: string }
        public_key_bits: { type: integer }
        signature_algorithm: { type: string }
        embedded_license: { type: string, enum: [present, absent, unknown] }
        parse_error: { type: string }
    SourceResult:
      type: object
      required: [source_type, source_key, complete, certificates]
      properties:
        source_type: { type: string, enum: [user_store, folder] }
        source_key: { type: string }
        display_name: { type: string }
        user_sid: { type: string }
        path: { type: string }
        complete: { type: boolean }
        error: { type: string }
        certificates:
          type: array
          items: { $ref: '#/components/schemas/ObservedCertificate' }
        files:
          type: array
          items:
            type: object
            required: [path]
            properties:
              path: { type: string }
              sha256: { type: string }
              error: { type: string }
    LicenseInfo:
      type: object
      required: [kind, state]
      properties:
        kind: { type: string, enum: [client, server, unknown] }
        kind_raw: { type: string }
        kind_source: { type: string }
        state: { type: string, enum: [active, expired, not_installed, unknown, error] }
        valid_to_raw: { type: string }
        valid_to_utc: { type: string }
        time_basis: { type: string }
        term_kind: { type: string, enum: [trial, time_limited, perpetual, unknown] }
        is_trial: { type: string, enum: ['true', 'false', unknown] }
        source: { type: string }
        error: { type: string }
    CSPResult:
      type: object
      required: [scanned, complete, present, license]
      properties:
        scanned: { type: boolean }
        complete: { type: boolean }
        present: { type: boolean }
        product_version: { type: string }
        core_version: { type: string }
        products:
          type: array
          items:
            type: object
            properties:
              product_guid: { type: string }
              display_name: { type: string }
              display_version: { type: string }
              branch: { type: string }
        license: { $ref: '#/components/schemas/LicenseInfo' }
        error: { type: string }
    Report:
      type: object
      required: [report_id, scan_seq, collected_at, started_at, finished_at, hostname, status, profiles_complete, profiles, sources, csp]
      properties:
        report_id: { type: string, format: uuid }
        scan_seq: { type: integer, minimum: 0 }
        collected_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        agent_version: { type: string }
        hostname: { type: string }
        status: { type: string, enum: [complete, partial] }
        profiles_complete: { type: boolean }
        profiles:
          type: array
          items: { $ref: '#/components/schemas/ProfileResult' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceResult' }
        csp: { $ref: '#/components/schemas/CSPResult' }
        errors:
          type: array
          items: { type: string }
