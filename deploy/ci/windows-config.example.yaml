runner:
  file: C:/TelehackCI/runner/.runner
  capacity: 1
  timeout: 1h
  shutdown_timeout: 5m
  labels: [telehack-windows:host]
  envs:
    TELEHACK_E2E_CONFIG: C:/TelehackCI/private/acceptance.json
    WIX_DIR: C:/TelehackCI/tools/wix314
    GOPATH: C:/TelehackCI/cache/go
    GOCACHE: C:/TelehackCI/cache/go-build
    npm_config_cache: C:/TelehackCI/cache/npm
host:
  workdir_parent: C:/TelehackCI/work
cache:
  dir: C:/TelehackCI/cache/actions
  host: 127.0.0.1
  port: 18088
log:
  job:
    dir: C:/TelehackCI/logs
    retention: 168h
    max_size: 20MB
