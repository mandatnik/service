runner:
  file: C:/MandatnikCI/runner/.runner
  capacity: 1
  timeout: 1h
  shutdown_timeout: 5m
  labels: [telehack-windows:host]
  envs:
    MANDATNIK_E2E_CONFIG: C:/MandatnikCI/private/acceptance.json
    WIX_DIR: C:/MandatnikCI/tools/wix314
    GOPATH: C:/MandatnikCI/cache-system/go
    GOCACHE: C:/MandatnikCI/cache-system/go-build
    npm_config_cache: C:/MandatnikCI/cache-system/npm
host:
  workdir_parent: C:/MandatnikCI/work-system
cache:
  dir: C:/MandatnikCI/cache-system/actions
  host: 127.0.0.1
  port: 18088
log:
  job:
    dir: C:/MandatnikCI/logs
    retention: 168h
    max_size: 20MB
